management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true     # Grafana에서 p95/p99 계산할 수 있게 히스토그램으로

server:
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coupon
    username: coupon
    password: coupon1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop       # 개발용. 운영이면 validate
    defer-datasource-initialization: true   # 테이블 생성(JPA) 후 data.sql 실행
    properties:
      hibernate:
        format_sql: true
    show-sql: true