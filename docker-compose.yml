services:
  postgres:
    image: postgres:16-alpine
    container_name: coupon-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data: